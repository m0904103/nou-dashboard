<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空大暑修期末特訓 | NOU Study Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0f172a;
            --secondary-bg: #1e293b;
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 1s ease-out;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 900px;
            animation: fadeInUp 1s ease-out;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.05) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            transition: all 0.75s ease;
        }

        .glass-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px var(--accent-glow);
        }

        .glass-card:hover::before {
            left: 200%;
        }

        .card-icon {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .glass-card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .status-badge {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.3);
            letter-spacing: 1px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .title { font-size: 2rem; }
            .portal-grid { grid-template-columns: 1fr; }
            .glass-card { padding: 2rem 1.5rem; }
        }
    
        /* ─── COUNTDOWN TIMER ─── */
        .countdown-box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin: 0 auto 3rem auto;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            max-width: 600px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 1s ease-out;
        }
        .countdown-box::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            animation: shine 3s infinite;
        }
        @keyframes shine { 100% { left: 200%; } }
        .cd-title { font-size: 1.1rem; color: #38bdf8; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px;}
        .cd-subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
        .cd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .cd-item { background: rgba(0,0,0,0.3); padding: 10px 5px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .cd-num { font-size: 1.8rem; font-weight: 900; color: #f8fafc; font-family: monospace; line-height: 1; margin-bottom: 4px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .cd-label { font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase; }
        .cd-footer { font-size: 0.95rem; color: #fbbf24; font-weight: 700; background: rgba(251,191,36,0.1); padding: 8px; border-radius: 8px; }
</style>

</head>
<body>

    <div class="header">
        <h1 class="title">暑修期末特訓</h1>
        <p class="subtitle">NOU Study Portal ｜ 選擇你的特訓科目</p>
    </div>

    
    <div class="countdown-box">
        <div class="cd-title">⚠️ 115暑修 期末考 倒數計時 ⚠️</div>
        <div class="cd-subtitle">考試日期：115年9月5日 (週六)</div>
        <div class="cd-grid">
            <div class="cd-item"><div class="cd-num" id="cd-days">--</div><div class="cd-label">Days</div></div>
            <div class="cd-item"><div class="cd-num" id="cd-hours">--</div><div class="cd-label">Hours</div></div>
            <div class="cd-item"><div class="cd-num" id="cd-mins">--</div><div class="cd-label">Mins</div></div>
            <div class="cd-item"><div class="cd-num" id="cd-secs">--</div><div class="cd-label">Secs</div></div>
        </div>
        <div class="cd-footer"><span>💪</span> 期末考特訓團隊 祝福大家高分 All Pass！撐下去就是你的！</div>
    </div>

    <script>
    function initCountdown() {
        const targetDate = new Date('2026-09-05T15:00:00+08:00').getTime();
        
        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            
            if (distance < 0) {
                document.getElementById('cd-days').innerText = "00";
                document.getElementById('cd-hours').innerText = "00";
                document.getElementById('cd-mins').innerText = "00";
                document.getElementById('cd-secs').innerText = "00";
                return;
            }
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById('cd-days').innerText = days.toString().padStart(2, '0');
            document.getElementById('cd-hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('cd-mins').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('cd-secs').innerText = seconds.toString().padStart(2, '0');
        }, 1000);
    }
    initCountdown();
    </script>

    <div class="portal-grid">
        <!-- 糕餅製作 -->
        <a href="https://m0904103.github.io/taiwan-pastry-web/#/swipe" class="card-link" target="_blank" rel="noopener noreferrer">
            <div class="glass-card">
                <div class="status-badge">ONLINE</div>
                <div class="card-icon">🥮</div>
                <h2 class="card-title">傳統糕餅製作</h2>
                <p class="card-desc">直覺式滑滑卡特訓系統，快速掌握各式糕餅製作訣竅與傳統知識。</p>
            </div>
        </a>

        <!-- 幸福處方箋 -->
        <a href="https://m0904103.github.io/nou-happiness-100-app/" class="card-link" target="_blank" rel="noopener noreferrer">
            <div class="glass-card">
                <div class="status-badge">ONLINE</div>
                <div class="card-icon">💊</div>
                <h2 class="card-title">人生100幸福處方箋</h2>
                <p class="card-desc">包含 60 題選擇題闖關拼圖，以及牧野篤教授理念校準之 25 題滑滑卡。</p>
            </div>
        </a>
    </div>

</body>
</html>
